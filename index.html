<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#1d3a5c" />
  <title>Park Test</title>
  <link rel="stylesheet" href="./src/style.css" />
</head>
<body>
  <div id="game"></div>

  <div id="hud">
    <div class="panel clock">
      <div class="day">Day 1 · Fright Fest-ish</div>
      <div class="time" id="time">10:00 AM</div>
      <div class="speed">
        <button data-speed="0">❚❚</button>
        <button data-speed="1" class="on">▶</button>
        <button data-speed="3">▶▶</button>
      </div>
    </div>
    <div class="panel meters">
      <div class="target">Target: <b>The Hendersons</b></div>
      <div class="meter"><span>Misery</span><i><b id="m-misery" style="--v: 10%; --c: #d33"></b></i></div>
      <div class="meter"><span>Patience</span><i><b id="m-patience" style="--v: 90%; --c: #3b3"></b></i></div>
      <div class="meter"><span>Suspicion</span><i><b id="m-suspicion" style="--v: 5%; --c: #e90"></b></i></div>
    </div>
  </div>
  <div id="toast"></div>

  <div id="rotate">
    <div>🔄</div>
    <p>Turn your phone sideways.<br /><small>Management insists.</small></p>
  </div>

  <script type="module" src="./src/main.ts"></script>
</body>
</html>
