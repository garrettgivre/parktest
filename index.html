<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#1d3a5c" />
  <title>Park Test</title>
  <link rel="stylesheet" href="./src/proto/proto.css" />
</head>
<body>
  <div id="game"></div>
  <div id="sky"></div>

  <div id="clock" class="panel">
    <div class="sub">Funtier Lands · Fright Fest-ish</div>
    <div class="time" id="time">9:55 AM</div>
    <div class="speed">
      <button data-speed="0">❚❚</button>
      <button data-speed="1" class="on">▶</button>
      <button data-speed="2">▶▶</button>
      <button data-speed="4">▶▶▶</button>
      <button id="gear" title="Settings">⚙️</button>
    </div>
    <div id="settings" class="hidden">
      <label><input type="checkbox" data-set="autopause" /> Auto-pause on big moments</label>
      <label><input type="checkbox" data-set="sound" /> Sound</label>
      <button data-set="tips">Show tips again</button>
    </div>
  </div>

  <div id="duty" class="panel hidden"></div>

  <div id="meters" class="panel">
    <div class="score"><span>Misery</span><b id="misery">0</b></div>
    <div class="meter"><span>Patience</span><i><b id="m-patience" style="--c: #3b3"></b></i></div>
    <div class="meter"><span>Suspicion</span><i><b id="m-suspicion" style="--c: #e90"></b></i></div>
  </div>

  <div id="feed"></div>
  <div id="side" class="panel hidden"></div>

  <div id="belt">
    <div id="me" class="chip"></div>
    <div class="row">
      <span id="tools"></span>
      <button id="follow" class="round" title="Tail the Hendersons">👥</button>
      <button id="findme" class="round" title="Find me">📍</button>
      <button id="findthem" class="round" title="Find the Hendersons">🔍</button>
    </div>
  </div>
  <div id="toast"></div>
  <div id="combo"></div>

  <div id="intro" class="overlay">
    <div class="card" id="intro-card"></div>
  </div>

  <div id="results" class="overlay hidden"><div class="card" id="results-card"></div></div>

  <div id="rotate">
    <div>🔄</div>
    <p>Turn your phone sideways.<br /><small>Management insists.</small></p>
  </div>

  <script type="module" src="./src/proto/main.ts"></script>
</body>
</html>
